<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Notes 📝</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="notes-page">
  <h1 class="notes-heading">📒 My Notes</h1>

  </div>
  <script src="../script.js"></script>
</body>
</html>
